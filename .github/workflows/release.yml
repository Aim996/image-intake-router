name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Validate v2.1 fixtures against schema
        run: python image-intake-router/tests/test_schema_fixtures.py -v
      - name: Validate tag version and run publication gates
        shell: bash
        run: |
          VERSION_FROM_TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s\n' "$VERSION_FROM_TAG" | cmp -s - VERSION; then
            echo "Tag version does not match VERSION" >&2
            exit 1
          fi
          python -m unittest tests.test_repository_contract -v
          python image-intake-router/tests/test_static_contract.py -v
          python -m json.tool image-intake-router/templates/image-intake-router.schema.json
          python -m unittest tests.test_release_pipeline -v
          python -m scripts.build_release --root . --output-dir dist --version "$VERSION_FROM_TAG"
          python -m scripts.verify_release \
            --archive "dist/image-intake-router-$VERSION_FROM_TAG.tgz" \
            --checksum "dist/image-intake-router-$VERSION_FROM_TAG.tgz.sha256" \
            --install-root build/smoke
      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: |
            dist/
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: verified-release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION_FROM_TAG="${GITHUB_REF_NAME#v}"
          ARCHIVE="verified-release/dist/image-intake-router-$VERSION_FROM_TAG.tgz"
          CHECKSUM="$ARCHIVE.sha256"
          NOTES="verified-release/RELEASE_NOTES.md"
          for required_file in "$ARCHIVE" "$CHECKSUM" "$NOTES"; do
            if [ ! -f "$required_file" ]; then
              echo "Missing verified release file: $required_file" >&2
              exit 1
            fi
          done
          mapfile -t DIST_FILES < <(find verified-release/dist -type f -printf '%P\n' | sort)
          EXPECTED_FILES=(
            "image-intake-router-$VERSION_FROM_TAG.tgz"
            "image-intake-router-$VERSION_FROM_TAG.tgz.sha256"
          )
          if [ "${DIST_FILES[*]}" != "${EXPECTED_FILES[*]}" ]; then
            echo "Verified release artifact has unexpected dist files" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" "$CHECKSUM" \
            --title "image-intake-router $VERSION_FROM_TAG" \
            --notes-file "$NOTES"
