name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Run repository contracts
        run: python -m unittest tests.test_repository_contract -v
      - name: Run Skill static contracts
        run: python image-intake-router/tests/test_static_contract.py -v
      - name: Validate v3 fixtures against schema
        run: python image-intake-router/tests/test_schema_fixtures.py -v
      - name: Parse schema
        run: python -m json.tool image-intake-router/templates/image-intake-router.schema.json
      - name: Run release pipeline tests
        run: python -m unittest tests.test_release_pipeline -v
      - name: Build release assets
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          python -m scripts.build_release --root . --output-dir dist --version "$VERSION"
      - name: Verify release assets
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          python -m scripts.verify_release \
            --archive "dist/image-intake-router-$VERSION.tgz" \
            --checksum "dist/image-intake-router-$VERSION.tgz.sha256" \
            --install-root build/smoke
